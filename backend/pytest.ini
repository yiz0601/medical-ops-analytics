[pytest]
; 阶段四（后端服务）测试配置
; - 仅收集单元测试、接口测试与文档校验（tests/test_etl_smoke.py 为阶段二/三的
;   独立冒烟脚本，使用自己的临时库，需单独运行：python -m tests.test_etl_smoke）
testpaths = tests/unit tests/api tests/test_4_3_docs.py tests/test_docs_integrity.py
pythonpath = .
python_files = test_*.py
addopts = -ra --cov=app --cov-report=term-missing --cov-fail-under=80
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
