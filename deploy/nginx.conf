# 医疗运营数据主题分析平台 —— 边缘 Nginx（四服务拓扑的入口）
# 静态资源反代到 frontend 容器，/api 反代到 backend 容器（8000），透传 Host 与真实 IP。
# 校验四服务（mysql / backend / frontend / nginx）健康状态：python deploy/health_check.py

upstream moa_backend {
    server backend:8000;
    keepalive 32;
}

upstream moa_frontend {
    server frontend:80;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    charset utf-8;
    client_max_body_size 50m;

    access_log /var/log/nginx/moa.access.log;
    error_log  /var/log/nginx/moa.error.log warn;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 前端静态资源（SPA history 回退由 frontend 容器负责）
    location / {
        proxy_pass http://moa_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # 后端接口
    location /api/ {
        proxy_pass http://moa_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }

    # 大模型生成类接口耗时较长，单独放宽超时并关闭缓冲
    location ~ ^/api/llm/ {
        proxy_pass http://moa_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    # 接口文档
    location ~ ^/(docs|redoc) {
        proxy_pass http://moa_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 健康检查（聚合后端 /health）
    location = /health {
        proxy_pass http://moa_backend/health;
        access_log off;
        proxy_set_header Host $host;
    }
}
