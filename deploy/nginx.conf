# 医疗运营数据主题分析平台 —— Nginx 站点配置
# 静态前端 + /api 反向代理到后端 FastAPI 容器

upstream moa_backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    charset utf-8;
    client_max_body_size 50m;

    access_log /var/log/nginx/moa.access.log;
    error_log  /var/log/nginx/moa.error.log warn;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # 前端单页应用路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 后端接口
    location /api/ {
        proxy_pass http://moa_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }

    # 大模型生成类接口耗时较长，单独放宽超时
    location ~ ^/api/v1/ai/ {
        proxy_pass http://moa_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    # 接口文档
    location ~ ^/(docs|redoc) {
        proxy_pass http://moa_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /health {
        proxy_pass http://moa_backend/health;
        access_log off;
    }
}
